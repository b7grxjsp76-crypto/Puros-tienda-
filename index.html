<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul | Rústico & Esencial</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   ESTÉTICA RÚSTICA MINIMALISTA (CSS)
   ========================================================================== */
:root {
    --oro-viejo: #c2a35d;
    --madera-oscura: #0f0e0d;
    --papel: #d9d4cc;
    --negro-mate: #121212;
    --humo: rgba(245, 245, 245, 0.8);
    --transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
    background-color: var(--madera-oscura);
    color: var(--papel);
    font-family: 'Montserrat', sans-serif;
    line-height: 1.6;
}

/* Textura sutil de papel/madera */
body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('https://www.transparenttextures.com/patterns/dark-wood.png');
    opacity: 0.15; z-index: -1; pointer-events: none;
}

h1, h2, h3, .rustico { font-family: 'Playfair Display', serif; font-weight: 400; }

/* NAVEGACIÓN MINIMAL */
.nav {
    padding: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: fixed;
    width: 100%;
    top: 0; z-index: 1000;
    background: linear-gradient(to bottom, rgba(15,14,13,1), transparent);
}

.logo img { height: 60px; filter: grayscale(1) sepia(0.5); transition: 0.4s; }
.logo img:hover { filter: grayscale(0) sepia(0); }

.menu a {
    color: var(--papel);
    text-decoration: none;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-left: 30px;
    opacity: 0.6;
    transition: 0.4s;
}

.menu a:hover { opacity: 1; color: var(--oro-viejo); }

/* HERO SECCIÓN */
.hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(rgba(15,14,13,0.5), rgba(15,14,13,1)), url('file_00000000e124720eacda71c2b88a43d3.png');
    background-size: cover;
    background-position: center;
}

.hero h1 { font-size: clamp(80px, 15vw, 180px); color: var(--papel); margin-bottom: -20px; }
.hero p { font-size: 12px; letter-spacing: 10px; text-transform: uppercase; opacity: 0.5; }

/* GRID DE PRODUCTOS (LA CAVA) */
.cava { padding: 150px 5vw; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 80px; }

.puro-item { text-align: center; cursor: pointer; transition: var(--transition); position: relative; }

.puro-item img { 
    width: 100%; height: 500px; object-fit: cover; 
    filter: grayscale(0.3) brightness(0.8);
    transition: var(--transition);
    border-radius: 2px;
}

.puro-item:hover img { filter: grayscale(0) brightness(1); transform: translateY(-10px); }

.puro-item h3 { font-size: 32px; margin-top: 25px; color: var(--oro-viejo); }
.puro-item span { font-size: 14px; opacity: 0.5; letter-spacing: 2px; }
.puro-item .precio { display: block; margin-top: 10px; font-weight: 700; color: var(--papel); font-size: 18px; }

/* PÁGINA DE DETALLE INTERNA (DINÁMICA) */
#page-product {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: var(--madera-oscura);
    z-index: 2000;
    overflow-y: auto;
}

.product-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
}

@media (max-width: 900px) { .product-layout { grid-template-columns: 1fr; } }

.product-gallery { position: sticky; top: 0; height: 100vh; }
.product-gallery img { width: 100%; height: 100%; object-fit: cover; }

.product-info { padding: 100px 80px; display: flex; flex-direction: column; justify-content: center; }
.product-info h2 { font-size: 60px; color: var(--oro-viejo); margin-bottom: 20px; }
.product-info .meta { font-size: 12px; text-transform: uppercase; letter-spacing: 4px; opacity: 0.6; margin-bottom: 40px; }
.product-info p { font-size: 18px; color: #bbb; margin-bottom: 40px; font-family: 'Playfair Display', serif; font-style: italic; }

.specs-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 50px; border-top: 1px solid #333; padding-top: 40px; }
.spec-item b { display: block; color: var(--oro-viejo); text-transform: uppercase; font-size: 10px; letter-spacing: 2px; margin-bottom: 5px; }

.btn-back { position: fixed; top: 40px; right: 40px; background: none; border: 1px solid var(--oro-viejo); color: var(--oro-viejo); padding: 15px 25px; cursor: pointer; z-index: 2100; text-transform: uppercase; font-size: 10px; letter-spacing: 2px; transition: 0.3s; }
.btn-back:hover { background: var(--oro-viejo); color: black; }

/* COMPRA RAPIDA */
.buy-controls { display: flex; align-items: center; gap: 20px; }
.qty-input { background: transparent; border: 1px solid #333; color: white; padding: 15px; width: 60px; text-align: center; }
.btn-add { background: var(--oro-viejo); color: black; border: none; padding: 15px 40px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; flex-grow: 1; }

/* CARRITO */
.cart-notification {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
    background: var(--oro-viejo); color: black; padding: 15px 40px;
    border-radius: 50px; font-weight: 700; font-size: 12px;
    display: none; z-index: 3000; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

</style>
</head>

<body>

<nav class="nav">
    <div class="logo"><img src="file_000000009bac71f5a5db74bc3bed2a62.png" alt="MAFU"></div>
    <div class="menu">
        <a href="#" onclick="location.reload()">Inicio</a>
        <a href="#cava">La Cava</a>
        <a href="https://wa.me/56998644532">Contacto</a>
    </div>
</nav>

<section class="hero">
    <p>Legado de Vuelta Abajo</p>
    <h1>MAFU</h1>
    <p>Cuban Soul</p>
</section>

<section class="cava" id="cava">
    
    <div class="puro-item" onclick="goToProduct('clasico')">
        <img src="Screenshot_20260501-034528.png" alt="MAFU Clásico">
        <span>Vitola: Robusto</span>
        <h3>Clásico</h3>
        <span class="precio">$12 USD</span>
    </div>

    <div class="puro-item" onclick="goToProduct('reserva')">
        <img src="Screenshot_20260501-034604.png" alt="MAFU Reserva">
        <span>Vitola: Toro</span>
        <h3>Reserva Especial</h3>
        <span class="precio">$18 USD</span>
    </div>

    <div class="puro-item" onclick="goToProduct('premium')">
        <img src="Screenshot_20260501-034637.png" alt="MAFU Premium">
        <span>Vitola: Churchill</span>
        <h3>Premium Maduro</h3>
        <span class="precio">$25 USD</span>
    </div>

</section>

<div id="page-product">
    <button class="btn-back" onclick="closeProduct()">← Volver a la Cava</button>
    <div class="product-layout" id="product-content">
        </div>
</div>

<div class="cart-notification" id="cart-pop">¡Añadido al Humidor!</div>

<script>
// BASE DE DATOS DE PRODUCTOS
const db = {
    clasico: {
        name: "MAFU Clásico",
        price: 12,
        img: "Screenshot_20260501-034528.png",
        desc: "Un viaje sensorial a las mañanas de Pinar del Río. Este Robusto ofrece una fumada sedosa con una capa Connecticut que envuelve notas sutiles de cedro y vainilla.",
        vitola: "Robusto (50 x 124mm)",
        fortaleza: "Suave - Media",
        capa: "Connecticut Ecuador",
        maridaje: "Café arábico o Ron blanco ligero."
    },
    reserva: {
        name: "MAFU Reserva Especial",
        price: 18,
        img: "Screenshot_20260501-034604.png",
        desc: "El equilibrio perfecto. Tres años de añejamiento en cedro otorgan a esta pieza una complejidad inigualable, con un retrogusto a cuero noble y café tostado.",
        vitola: "Toro (52 x 152mm)",
        fortaleza: "Media - Fuerte",
        capa: "Habana 2000",
        maridaje: "Whisky Single Malt o Ron añejo 12 años."
    },
    premium: {
        name: "MAFU Premium Maduro",
        price: 25,
        img: "Screenshot_20260501-034637.png",
        desc: "Intensidad en su máxima expresión. La capa San Andrés Maduro, aceitosa y oscura, esconde una potencia diseñada para el fumador experimentado.",
        vitola: "Churchill (48 x 178mm)",
        fortaleza: "Fuerte",
        capa: "San Andrés Maduro",
        maridaje: "Vino tinto con cuerpo o Café espresso doble."
    }
};

function goToProduct(key) {
    const p = db[key];
    const layout = document.getElementById('product-content');
    
    layout.innerHTML = `
        <div class="product-gallery">
            <img src="${p.img}" alt="${p.name}">
        </div>
        <div class="product-info">
            <div class="meta">MAFU Colección Privada</div>
            <h2>${p.name}</h2>
            <p>"${p.desc}"</p>
            
            <div class="specs-grid">
                <div class="spec-item"><b>Vitola</b>${p.vitola}</div>
                <div class="spec-item"><b>Fortaleza</b>${p.fortaleza}</div>
                <div class="spec-item"><b>Capa</b>${p.capa}</div>
                <div class="spec-item"><b>Maridaje</b>${p.maridaje}</div>
            </div>

            <div style="font-size: 32px; margin-bottom: 30px; font-weight: 200;">$${p.price} USD</div>

            <div class="buy-controls">
                <input type="number" value="1" min="1" class="qty-input" id="buy-qty">
                <button class="btn-add" onclick="orderWA('${p.name}', ${p.price})">Pedir por WhatsApp</button>
            </div>
        </div>
    `;
    
    document.getElementById('page-product').style.display = 'block';
    document.body.style.overflow = 'hidden';
}

function closeProduct() {
    document.getElementById('page-product').style.display = 'none';
    document.body.style.overflow = 'auto';
}

function orderWA(name, price) {
    const qty = document.getElementById('buy-qty').value;
    const total = price * qty;
    const msg = `Hola MAFU, me interesa adquirir:%0A- ${name}%0A- Cantidad: ${qty}%0A- Total: $${total} USD`;
    window.open(`https://wa.me/56998644532?text=${msg}`);
    
    // Notificación visual
    const pop = document.getElementById('cart-pop');
    pop.style.display = 'block';
    setTimeout(() => pop.style.display = 'none', 3000);
}
</script>

</body>
</html>
