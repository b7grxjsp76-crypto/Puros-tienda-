<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#0f0f0f;
  color:#fff;
}

/* HEADER */
.header{
  background:#000;
  padding:15px 0;
  border-bottom:2px solid #d4af37;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* LOGO */
.logo img{
  height:60px;
}

/* NAV */
.nav a{
  color:#fff;
  margin-left:20px;
  text-decoration:none;
  font-weight:bold;
}

.nav a:hover{
  color:#d4af37;
}

/* HERO */
.hero{
  height:65vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url('Screenshot_20260501-034528.png') center/cover;
}

.hero h2{
  font-size:42px;
  color:#d4af37;
}

/* BOTÓN */
.btn{
  display:inline-block;
  margin-top:20px;
  padding:12px 25px;
  background:#d4af37;
  color:#000;
  text-decoration:none;
  border-radius:5px;
  font-weight:bold;
}

/* PRODUCTOS */
.productos{
  padding:60px 0;
}

/* GRID (esto es clave para que no se vean en columna) */
.productos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.producto-card{
  background:#1a1a1a;
  border-radius:10px;
  overflow:hidden;
  transition:.3s;
}

.producto-card:hover{
  transform:scale(1.03);
}

.producto-imagen img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.producto-info{
  padding:20px;
}

.producto-info h3{
  color:#d4af37;
}

.descripcion{
  margin:10px 0;
}

.precio{
  color:#d4af37;
  font-weight:bold;
  font-size:18px;
}

.btn-comprar{
  margin-top:10px;
  padding:10px 15px;
  border:none;
  background:#d4af37;
  cursor:pointer;
  border-radius:5px;
  font-weight:bold;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  background:#000;
  border-top:1px solid #333;
}
</style>
</head>

<body>

<header class="header">
  <div class="container">
    
    <!-- LOGO -->
    <div class="logo">
      <img src="file_000000009bac71f5a5db74bc3bed2a62.png" alt="MAFU Cuban Soul">
    </div>

    <nav class="nav">
      <a href="#inicio">Inicio</a>
      <a href="#productos">Productos</a>
    </nav>

  </div>
</header>

<section id="inicio" class="hero">
  <div>
    <h2>MAFU Cuban Soul</h2>
    <p>Tradición, lujo y sabor auténtico</p>
    <a href="#productos" class="btn">Ver Productos</a>
  </div>
</section>

<section id="productos" class="productos">
  <div class="container">
    
    <div class="productos-grid">

      <!-- Producto 1 -->
      <div class="producto-card">
        <div class="producto-imagen">
          <img src="Screenshot_20260501-034528.png">
        </div>
        <div class="producto-info">
          <h3>Puro Clásico (Cohiba)</h3>
          <p class="descripcion">Suave, equilibrado y elegante.</p>

          <span class="precio" data-usd="12">$12 USD</span>
          <span class="clp"></span><br>
          <button onclick="comprar('Puro Clásico',12)" class="btn-comprar">Comprar</button>
        </div>
      </div>

      <!-- Producto 2 -->
      <div class="producto-card">
        <div class="producto-imagen">
          <img src="Screenshot_20260501-034604.png">
        </div>
        <div class="producto-info">
          <h3>Puro Reserva (Montecristo)</h3>
          <p class="descripcion">Intenso y aromático.</p>

          <span class="precio" data-usd="18">$18 USD</span>
          <span class="clp"></span><br>
          <button onclick="comprar('Puro Reserva',18)" class="btn-comprar">Comprar</button>
        </div>
      </div>

      <!-- Producto 3 -->
      <div class="producto-card">
        <div class="producto-imagen">
          <img src="Screenshot_20260501-034637.png">
        </div>
        <div class="producto-info">
          <h3>Puro Premium (Partagás)</h3>
          <p class="descripcion">Fuerte, complejo y de lujo.</p>

          <span class="precio" data-usd="25">$25 USD</span>
          <span class="clp"></span><br>
          <button onclick="comprar('Puro Premium',25)" class="btn-comprar">Comprar</button>
        </div>
      </div>

    </div>

  </div>
</section>

<footer class="footer">
  <p>© 2026 MAFU Cuban Soul</p>
</footer>

<script>
const tasa = 950;

document.querySelectorAll(".precio").forEach(el => {
  const usd = el.dataset.usd;
  const clp = usd * tasa;
  el.parentElement.querySelector(".clp").innerText =
    " / $" + clp.toLocaleString("es-CL") + " CLP";
});

function comprar(nombre, precio){
  alert("Elegiste: " + nombre + " ($" + precio + " USD)");
}
</script>

</body>
</html>
