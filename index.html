<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul | El Humo Maestro de Vuelta Abajo</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,900&family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --dorado: #d4af37;
  --negro-absoluto: #050505;
  --gris-tabaco: #1a1a1a;
  --blanco-humo: #f5f5f5;
  --transicion: all 0.4s ease;
}

body {
  font-family: 'Lato', sans-serif;
  background: var(--negro-absoluto);
  color: var(--blanco-humo);
}

/* ====== NUEVO CONTROL CANTIDAD ====== */
.qty-control {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
}

.qty-control button {
  width: 32px;
  height: 32px;
  border-radius: 8px;
  border: none;
  background: var(--dorado);
  color: black;
  font-weight: bold;
  cursor: pointer;
}

.qty-control input {
  width: 60px;
  text-align: center;
  background: #000;
  border: 1px solid var(--dorado);
  color: white;
  border-radius: 10px;
}

/* ====== CARD ====== */
.card {
  background: var(--gris-tabaco);
  border-radius: 25px;
  padding: 40px;
  cursor: pointer;
  transition: var(--transicion);
}

.card:hover {
  border: 1px solid var(--dorado);
}

.card img {
  width: 100%;
  border-radius: 20px;
  margin-bottom: 20px;
}

.btn-buy {
  width: 100%;
  padding: 15px;
  background: var(--dorado);
  border: none;
  cursor: pointer;
  font-weight: bold;
}
</style>
</head>

<body>

<section style="padding: 60px; max-width: 1200px; margin:auto; display:grid; gap:40px; grid-template-columns: repeat(auto-fit,minmax(300px,1fr));">

<!-- CLASICO -->
<div class="card" onclick="goTo('puro-clasico.html')">
  <img src="Screenshot_20260501-034528.png">
  <h3>MAFU Clásico</h3>
  <p>$12 USD</p>

  <div class="qty-control">
    <button onclick="event.stopPropagation(); changeQty('q_clasico', -1)">-</button>
    <input type="number" id="q_clasico" value="1" min="1">
    <button onclick="event.stopPropagation(); changeQty('q_clasico', 1)">+</button>
  </div>

  <button class="btn-buy"
    onclick="event.stopPropagation(); addToCart('MAFU Clásico',12,'q_clasico')">
    Añadir al Humidor
  </button>
</div>

<!-- RESERVA -->
<div class="card" onclick="goTo('puro-reserva.html')">
  <img src="Screenshot_20260501-034604.png">
  <h3>MAFU Reserva</h3>
  <p>$18 USD</p>

  <div class="qty-control">
    <button onclick="event.stopPropagation(); changeQty('q_reserva', -1)">-</button>
    <input type="number" id="q_reserva" value="1" min="1">
    <button onclick="event.stopPropagation(); changeQty('q_reserva', 1)">+</button>
  </div>

  <button class="btn-buy"
    onclick="event.stopPropagation(); addToCart('MAFU Reserva',18,'q_reserva')">
    Añadir al Humidor
  </button>
</div>

<!-- PREMIUM -->
<div class="card" onclick="goTo('puro-premium.html')">
  <img src="Screenshot_20260501-034637.png">
  <h3>MAFU Premium</h3>
  <p>$25 USD</p>

  <div class="qty-control">
    <button onclick="event.stopPropagation(); changeQty('q_premium', -1)">-</button>
    <input type="number" id="q_premium" value="1" min="1">
    <button onclick="event.stopPropagation(); changeQty('q_premium', 1)">+</button>
  </div>

  <button class="btn-buy"
    onclick="event.stopPropagation(); addToCart('MAFU Premium',25,'q_premium')">
    Añadir al Humidor
  </button>
</div>

</section>

<script>
// ===== CANTIDAD =====
function changeQty(id, change){
  const input = document.getElementById(id);
  let val = parseInt(input.value) || 1;
  val += change;
  if(val < 1) val = 1;
  input.value = val;
}

// ===== NAVEGACIÓN =====
function goTo(url){
  window.location.href = url;
}

// ===== CARRITO =====
let cart = [];

function addToCart(name, price, id){
  let qty = parseInt(document.getElementById(id).value);

  let item = cart.find(i => i.name === name);
  if(item){
    item.qty += qty;
  } else {
    cart.push({name, price, qty});
  }

  alert("Añadido al humidor");
}
</script>

</body>
</html>
