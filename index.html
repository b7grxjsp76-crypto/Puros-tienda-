<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAFU | Sistema de Gestión de Humidor</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@200;400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --oro: #c5a059;
            --oro-glow: rgba(197, 160, 89, 0.4);
            --negro-absoluto: #050505;
            --negro-tarjeta: #0a0a0a;
            --borde-premium: #1d1d1d;
            --blanco-humo: #f4f1ea;
            --wa-green: #25d366;
        }

        /* --- CONFIGURACIÓN BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--negro-absoluto); }
        ::-webkit-scrollbar-thumb { background: var(--oro); }

        body { 
            background-color: var(--negro-absoluto); 
            color: var(--blanco-humo); 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            letter-spacing: 0.5px;
        }

        /* --- NAVEGACIÓN TÉCNICA --- */
        .navbar {
            position: fixed; top: 0; width: 100%; padding: 25px 60px;
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(5,5,5,0.98); border-bottom: 1px solid var(--borde-premium); 
            z-index: 5000;
        }
        .brand { display: flex; align-items: center; gap: 20px; text-decoration: none; }
        .brand img { height: 75px; width: auto; filter: drop-shadow(0 0 10px var(--oro-glow)); }
        .brand span { font-family: 'Cinzel', serif; color: var(--oro); font-size: 28px; letter-spacing: 6px; }

        .cart-trigger { 
            cursor: pointer; position: relative; display: flex; align-items: center; gap: 15px; 
            padding: 10px 20px; border: 1px solid var(--oro); transition: 0.3s;
        }
        .cart-trigger:hover { background: var(--oro); color: #000; }
        .cart-label { font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; }
        .cart-badge { background: #fff; color: #000; font-size: 11px; padding: 3px 8px; font-weight: 900; }

        /* --- LAYOUT DEL CATÁLOGO --- */
        .main-wrapper { max-width: 1500px; margin: 160px auto 100px; padding: 0 40px; }
        
        .header-section { margin-bottom: 80px; border-left: 4px solid var(--oro); padding-left: 30px; }
        .header-section h1 { font-family: 'Cinzel', serif; font-size: 45px; color: var(--oro); text-transform: uppercase; }
        .header-section p { font-size: 14px; text-transform: uppercase; letter-spacing: 10px; opacity: 0.6; }

        .catalog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); 
            gap: 40px; 
        }

        /* --- TARJETA DE PRODUCTO ROBUSTA --- */
        .puro-card {
            background: var(--negro-tarjeta); border: 1px solid var(--borde-premium);
            padding: 35px; display: grid; grid-template-columns: 180px 1fr; gap: 30px;
            position: relative; transition: 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            overflow: hidden;
        }
        .puro-card:hover { border-color: var(--oro); transform: scale(1.02); }
        .puro-card::before {
            content: 'PREMIUM SELECTION'; position: absolute; top: 15px; right: -40px;
            background: var(--oro); color: #000; font-size: 9px; font-weight: 900;
            padding: 5px 40px; transform: rotate(45deg);
        }

        .img-container { 
            background: #000; border: 1px solid #151515; height: 300px;
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .img-container img { width: 90%; height: auto; filter: drop-shadow(0 15px 25px rgba(0,0,0,0.9)); }

        .puro-details h3 { font-family: 'Cinzel', serif; color: var(--oro); font-size: 24px; margin-bottom: 20px; }
        
        .specs-table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
        .specs-table td { padding: 12px 0; border-bottom: 1px solid #1a1a1a; font-size: 11px; text-transform: uppercase; }
        .specs-table .lbl { color: var(--oro); font-weight: 700; letter-spacing: 1px; }
        .specs-table .val { text-align: right; color: #888; }

        .pricing-area { display: flex; justify-content: space-between; align-items: flex-end; }
        .price-tag { font-family: 'Montserrat'; }
        .price-tag .usd { display: block; font-size: 32px; font-weight: 200; }
        .price-tag .clp { font-size: 13px; color: #555; }

        .btn-action { 
            background: var(--oro); color: #000; border: none; padding: 15px 30px;
            font-weight: 700; font-size: 12px; letter-spacing: 2px; cursor: pointer;
            transition: 0.3s;
        }
        .btn-action:hover { background: #fff; transform: translateY(-3px); }

        /* --- MODAL DE DETALLES TÉCNICOS --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 6000; backdrop-filter: blur(15px);
        }
        .modal-box {
            max-width: 1200px; margin: 60px auto; padding: 60px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 80px; position: relative;
        }
        .close-btn { position: absolute; top: 30px; right: 30px; color: var(--oro); font-size: 40px; cursor: pointer; }
        
        .modal-info h2 { font-family: 'Cinzel', serif; color: var(--oro); font-size: 50px; margin-bottom: 30px; }
        .modal-info p { font-size: 18px; line-height: 1.8; color: #ccc; margin-bottom: 40px; font-weight: 300; }

        /* --- PANEL DE GESTIÓN DEL CARRITO --- */
        #cart-sidebar {
            position: fixed; top: 0; right: -550px; width: 500px; height: 100vh;
            background: #080808; border-left: 2px solid var(--oro); z-index: 7000;
            padding: 60px 50px; transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        #cart-sidebar.open { right: 0; }
        
        .cart-header { border-bottom: 1px solid var(--oro); padding-bottom: 20px; margin-bottom: 40px; }
        .cart-header h2 { font-family: 'Cinzel'; font-size: 30px; color: var(--oro); }

        .cart-list { max-height: 55vh; overflow-y: auto; }
        .cart-item { 
            display: grid; grid-template-columns: 1fr 120px; align-items: center;
            padding: 25px 0; border-bottom: 1px solid #1a1a1a;
        }
        .item-meta b { display: block; color: var(--oro); font-family: 'Cinzel'; font-size: 18px; }
        
        .qty-manager { display: flex; align-items: center; border: 1px solid #333; justify-content: space-between; }
        .qty-manager button { background: none; border: none; color: #fff; width: 35px; height: 35px; cursor: pointer; font-size: 18px; }
        .qty-manager button:hover { background: var(--oro); color: #000; }
        .qty-manager span { font-weight: 700; width: 40px; text-align: center; }

        .cart-summary { margin-top: 40px; }
        .sum-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 18px; }
        .sum-total { font-size: 30px; color: var(--oro); font-weight: 700; margin-top: 20px; border-top: 1px solid #222; padding-top: 20px; }

        .wa-checkout {
            display: block; width: 100%; background: var(--wa-green); color: #fff;
            text-align: center; padding: 25px; text-decoration: none; font-weight: 700;
            margin-top: 40px; letter-spacing: 2px; font-size: 14px; transition: 0.3s;
        }
        .wa-checkout:hover { filter: brightness(1.1); transform: scale(1.02); }

        /* --- RESPONSIVE --- */
        @media (max-width: 1024px) {
            .catalog-grid, .modal-box { grid-template-columns: 1fr; }
            .navbar { padding: 20px; }
            .brand span { font-size: 20px; }
            #cart-sidebar { width: 100%; }
        }
    </style>
</head>
<body>

<header class="navbar">
    <a href="#" class="brand">
        <img src="file_000000009bac71f5a5db74bc3bed2a62.png" alt="MAFU">
        <span>MAFU</span>
    </a>
    <div class="cart-trigger" onclick="toggleCart()">
        <span class="cart-label">Gestión de Humidor</span>
        <span class="cart-badge" id="global-count">0</span>
    </div>
</header>

<div class="main-wrapper">
    <div class="header-section">
        <p>Expertise en Tabaco Cubano</p>
        <h1>Catálogo Maestro</h1>
    </div>

    <div class="catalog-grid" id="main-catalog">
        </div>
</div>

<div id="modal-overlay" class="modal-overlay">
    <span class="close-btn" onclick="closeModal()">✕</span>
    <div id="modal-container" class="modal-box"></div>
</div>

<div id="cart-sidebar">
    <div class="cart-header">
        <h2>Mi Selección</h2>
    </div>
    <div id="cart-items-list" class="cart-list">
        </div>
    <div class="cart-summary">
        <div class="sum-row"><span>Subtotal USD:</span><span id="sum-usd">$0.00</span></div>
        <div class="sum-row" style="opacity:0.6;"><span>Estimación CLP:</span><span id="sum-clp">$0</span></div>
        <div class="sum-row sum-total"><span>TOTAL:</span><span id="grand-total">$0.00</span></div>
        <a href="#" class="wa-checkout" onclick="processOrder()">CONFIRMAR PEDIDO WHATSAPP</a>
        <p onclick="toggleCart()" style="text-align:center; margin-top:25px; cursor:pointer; font-size:11px; letter-spacing:3px; opacity:0.5;">CONTINUAR COMPRANDO</p>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN TÉCNICA DE PRODUCTOS ---
    const EXCHANGE_RATE = 950;
    const PRODUCT_DB = {
        p1: {
            id: 'p1',
            name: "MAFU Clásico Robusto",
            price: 12.00,
            image: "Screenshot_20260501-034528.png",
            longDesc: "Una pieza maestra de 124mm con cepo 50. Elaborado con hojas seleccionadas de Vuelta Abajo, ofreciendo una fumada equilibrada con notas terrosas y un final cremoso.",
            specs: { "Vitola": "Robusto", "Cepo": "50", "Fortaleza": "Media", "Añejamiento": "24 Meses", "Capa": "Habana Ecuador" }
        },
        p2: {
            id: 'p2',
            name: "MAFU Reserva Toro",
            price: 18.00,
            image: "Screenshot_20260501-034604.png",
            longDesc: "Para el conocedor exigente. Este Toro de 150mm destaca por su complejidad aromática. Presenta notas de cuero noble, pimienta negra y una evolución marcada en sus tres tercios.",
            specs: { "Vitola": "Toro", "Cepo": "52", "Fortaleza": "Media-Fuerte", "Añejamiento": "48 Meses", "Capa": "Criollo 98" }
        },
        p3: {
            id: 'p3',
            name: "MAFU Premium Churchill",
            price: 25.00,
            image: "Screenshot_20260501-034637.png",
            longDesc: "La joya de la corona. Un Churchill imponente de 178mm. Solo los maestros torcedores más experimentados participan en su creación. Notas de cacao amargo y melaza.",
            specs: { "Vitola": "Churchill", "Cepo": "48", "Fortaleza": "Fuerte", "Añejamiento": "60+ Meses", "Capa": "Maduro Cubano" }
        }
    };

    // --- LÓGICA DE GESTIÓN DE DATOS ---
    let cart = JSON.parse(localStorage.getItem('MAFU_STORAGE')) || {};

    function initCatalog() {
        const grid = document.getElementById('main-catalog');
        Object.values(PRODUCT_DB).forEach(p => {
            grid.innerHTML += `
                <div class="puro-card" onclick="openProduct('${p.id}')">
                    <div class="img-container">
                        <img src="${p.image}" alt="${p.name}">
                    </div>
                    <div class="puro-details">
                        <h3>${p.name}</h3>
                        <table class="specs-table">
                            <tr><td class="lbl">Vitola</td><td class="val">${p.specs.Vitola}</td></tr>
                            <tr><td class="lbl">Fortaleza</td><td class="val">${p.specs.Fortaleza}</td></tr>
                        </table>
                        <div class="pricing-area">
                            <div class="price-tag">
                                <span class="usd">$${p.price.toFixed(2)}</span>
                                <span class="clp">≈ $${(p.price * EXCHANGE_RATE).toLocaleString()} CLP</span>
                            </div>
                            <button class="btn-action" onclick="event.stopPropagation(); addItem('${p.id}')">AÑADIR</button>
                        </div>
                    </div>
                </div>
            `;
        });
        refreshUI();
    }

    // --- ACCIONES DEL CARRITO ---
    function addItem(id) {
        if(cart[id]) cart[id].qty++;
        else cart[id] = { ...PRODUCT_DB[id], qty: 1 };
        updateAndSave();
        if(!document.getElementById('cart-sidebar').classList.contains('open')) toggleCart();
    }

    function modifyQty(id, delta) {
        if(cart[id]) {
            cart[id].qty += delta;
            if(cart[id].qty <= 0) delete cart[id];
            updateAndSave();
        }
    }

    function updateAndSave() {
        localStorage.setItem('MAFU_STORAGE', JSON.stringify(cart));
        refreshUI();
    }

    function refreshUI() {
        const list = document.getElementById('cart-items-list');
        list.innerHTML = "";
        let totalUSD = 0;
        let count = 0;

        Object.keys(cart).forEach(id => {
            const item = cart[id];
            totalUSD += (item.price * item.qty);
            count += item.qty;
            list.innerHTML += `
                <div class="cart-item">
                    <div class="item-meta">
                        <b>${item.name}</b>
                        <small>$${item.price.toFixed(2)} USD p/u</small>
                    </div>
                    <div class="qty-manager">
                        <button onclick="modifyQty('${id}', -1)">-</button>
                        <span>${item.qty}</span>
                        <button onclick="modifyQty('${id}', 1)">+</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('global-count').innerText = count;
        document.getElementById('sum-usd').innerText = `$${totalUSD.toFixed(2)}`;
        document.getElementById('sum-clp').innerText = `$${(totalUSD * EXCHANGE_RATE).toLocaleString()}`;
        document.getElementById('grand-total').innerText = `$${totalUSD.toFixed(2)}`;
    }

    // --- UI INTERACTIVA ---
    function toggleCart() {
        document.getElementById('cart-sidebar').classList.toggle('open');
    }

    function openProduct(id) {
        const p = PRODUCT_DB[id];
        const container = document.getElementById('modal-container');
        container.innerHTML = `
            <div style="text-align:center;">
                <img src="${p.image}" style="max-height:600px; filter: drop-shadow(0 30px 50px #000);">
            </div>
            <div class="modal-info">
                <h2>${p.name}</h2>
                <p>${p.longDesc}</p>
                <div style="background:#0f0f0f; padding:40px; border:1px solid #222;">
                    <h4 style="color:var(--oro); letter-spacing:5px; margin-bottom:25px; font-size:12px;">FICHA TÉCNICA</h4>
                    ${Object.entries(p.specs).map(([k,v]) => `
                        <div style="display:flex; justify-content:space-between; margin-bottom:15px; border-bottom:1px solid #1a1a1a; padding-bottom:10px;">
                            <span style="font-size:13px; opacity:0.6;">${k}</span>
                            <span style="color:var(--oro); font-weight:700;">${v}</span>
                        </div>
                    `).join('')}
                </div>
                <button class="wa-checkout" style="background:var(--oro); color:#000; margin-top:40px;" onclick="addItem('${p.id}'); closeModal();">AÑADIR A LA SELECCIÓN</button>
            </div>
        `;
        document.getElementById('modal-overlay').style.display = 'block';
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modal-overlay').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function processOrder() {
        if(Object.keys(cart).length === 0) return alert("Seleccione al menos un ejemplar.");
        let msg = "Hola MAFU Cigars, deseo confirmar el siguiente pedido:%0A%0A";
        Object.values(cart).forEach(i => {
            msg += `• ${i.name} (x${i.qty}) - $${(i.price * i.qty).toFixed(2)} USD%0A`;
        });
        msg += `%0A*TOTAL ESTIMADO EN CLP: ${document.getElementById('sum-clp').innerText}*`;
        window.open(`https://wa.me/56998644532?text=${msg}`);
    }

    // Inicio
    initCatalog();
</script>

</body>
</html>
