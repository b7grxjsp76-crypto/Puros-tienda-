<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul | El Humo Maestro de Vuelta Abajo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,900&family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   FUNDAMENTOS Y ESTÉTICA DE LUJO
   ========================================================================== */
:root {
  --dorado: #d4af37;
  --dorado-mate: #aa8c2c;
  --negro-absoluto: #050505;
  --negro-carbon: #0d0d0d;
  --gris-tabaco: #1a1a1a;
  --blanco-humo: #f5f5f5;
  --transicion: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Lato', sans-serif;
  background: var(--negro-absoluto);
  color: var(--blanco-humo);
  line-height: 1.8;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
  opacity: 0.3; z-index: -1; pointer-events: none;
}

h1, h2, h3, h4, .brand { font-family: 'Playfair Display', serif; }

/* ==========================================================================
   NAVEGACIÓN
   ========================================================================== */
.header {
  background: rgba(0,0,0,0.95);
  padding: 25px 0;
  border-bottom: 2px solid var(--dorado);
  position: sticky;
  top: 0; z-index: 1000;
  backdrop-filter: blur(10px);
}

.header .logo { text-align: center; margin-bottom: 15px; }
.logo img { height: 95px; filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }

.nav { display: flex; justify-content: center; gap: 40px; }
.nav a {
  color: var(--dorado);
  text-decoration: none;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 5px;
  font-weight: 900;
  transition: var(--transicion);
}

/* ==========================================================================
   HERO
   ========================================================================== */
.hero {
  height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1511252194373-900898695034?q=80') center/cover fixed;
}

.hero-box { text-align: center; padding: 40px; border: 1px solid rgba(212,175,55,0.3); }
.hero h1 { font-size: clamp(60px, 12vw, 150px); color: var(--dorado); line-height: 1; font-style: italic; }

/* ==========================================================================
   PRODUCTOS
   ========================================================================== */
.productos { padding: 120px 20px; }
.prod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
  gap: 40px;
  max-width: 1300px;
  margin: auto;
}

.card {
  background: var(--gris-tabaco);
  border-radius: 30px;
  padding: 40px;
  border: 1px solid #222;
  transition: var(--transicion);
}

.card h3 { color: var(--dorado); font-size: 28px; margin-bottom: 15px; }
.precio-tag { font-size: 24px; font-weight: 900; color: white; display: block; margin-bottom: 20px; }

.btn-buy {
  width: 100%;
  padding: 15px;
  background: var(--dorado);
  color: black;
  font-weight: 900;
  border: none;
  border-radius: 50px;
  text-transform: uppercase;
  cursor: pointer;
}

/* ==========================================================================
   CARRITO MEJORADO
   ========================================================================== */
.cart-drawer {
  position: fixed; right: 30px; bottom: 120px; width: 350px;
  background: var(--gris-tabaco); border: 2px solid var(--dorado);
  border-radius: 20px; padding: 25px; display: none; z-index: 1002;
  box-shadow: 0 20px 60px rgba(0,0,0,1);
}

.cart-list { list-style: none; margin: 15px 0; max-height: 200px; overflow-y: auto; }
.cart-list li { 
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid #333; font-size: 14px;
}

.btn-vaciar {
  background: transparent;
  color: #ff4444;
  border: 1px solid #ff4444;
  padding: 5px 15px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12px;
  margin-top: 10px;
  width: 100%;
  transition: 0.3s;
}

.btn-vaciar:hover { background: #ff4444; color: white; }

.whatsapp-float {
  position: fixed; bottom: 35px; right: 35px; background: #25D366;
  width: 70px; height: 70px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 35px;
  color: white; text-decoration: none; z-index: 1001;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

</style>
</head>

<body>

<header class="header">
  <div class="logo"><img src="file_000000009bac71f5a5db74bc3bed2a62.png" alt="MAFU Logo"></div>
  <nav class="nav">
    <a href="#productos">Catálogo</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-box">
    <h1>MAFU</h1>
    <p>Cuban Soul</p>
  </div>
</section>

<section class="productos" id="productos">
  <div class="prod-grid">
    
    <div class="card">
      <h3>MAFU Clásico</h3>
      <span class="precio-tag">$12 USD</span>
      <div style="display: flex; gap: 10px;">
        <input type="number" value="1" min="1" id="q_clasico" style="width: 50px; background: #000; color: white; border: 1px solid var(--dorado); text-align: center;">
        <button class="btn-buy" onclick="addToCart('MAFU Clásico', 12, 'q_clasico')">Añadir</button>
      </div>
    </div>

    <div class="card">
      <h3>MAFU Reserva</h3>
      <span class="precio-tag">$18 USD</span>
      <div style="display: flex; gap: 10px;">
        <input type="number" value="1" min="1" id="q_reserva" style="width: 50px; background: #000; color: white; border: 1px solid var(--dorado); text-align: center;">
        <button class="btn-buy" onclick="addToCart('MAFU Reserva', 18, 'q_reserva')">Añadir</button>
      </div>
    </div>

  </div>
</section>

<div class="cart-drawer" id="cart-ui">
  <h3 style="color: var(--dorado); text-align: center;">Mi Humidor</h3>
  <ul id="cart-list" class="cart-list"></ul>
  <div id="cart-total" style="font-weight: 700; text-align: center; margin-bottom: 15px;"></div>
  
  <button onclick="sendOrder()" class="btn-buy" style="background: #25D366; color: white; margin-bottom: 10px;">Pedir por WhatsApp</button>
  <button onclick="clearCart()" class="btn-vaciar">Vaciar Carrito</button>
</div>

<a href="#" class="whatsapp-float" onclick="sendOrder(); return false;">W</a>

<script>
let cart = [];
const tasaCLP = 950;

function addToCart(name, price, qtyId) {
  const qty = parseInt(document.getElementById(qtyId).value);
  const existing = cart.find(i => i.name === name);
  
  if(existing) {
    existing.qty += qty;
  } else {
    cart.push({name, price, qty});
  }
  
  renderCart();
}

function clearCart() {
  if(confirm("¿Estás seguro de que deseas vaciar tu selección?")) {
    cart = [];
    renderCart();
  }
}

function renderCart() {
  const cartUI = document.getElementById('cart-ui');
  const list = document.getElementById('cart-list');
  const totalDiv = document.getElementById('cart-total');
  
  if (cart.length === 0) {
    cartUI.style.display = 'none';
    return;
  }

  cartUI.style.display = 'block';
  list.innerHTML = "";
  let totalUSD = 0;
  
  cart.forEach((item, index) => {
    const subtotal = item.price * item.qty;
    totalUSD += subtotal;
    list.innerHTML += `
      <li>
        <span>${item.name} (x${item.qty})</span>
        <b>$${subtotal} USD</b>
      </li>`;
  });
  
  const totalCLP = totalUSD * tasaCLP;
  totalDiv.innerHTML = `Total: $${totalUSD} USD <br> <small style="color:var(--dorado)">≈ $${totalCLP.toLocaleString()} CLP</small>`;
}

function sendOrder() {
  if(cart.length === 0) {
    alert("El carrito está vacío");
    return;
  }
  
  let msg = "Hola MAFU Cuban Soul, deseo adquirir:%0A";
  cart.forEach(i => msg += `• ${i.name} (x${i.qty})%0A`);
  msg += `%0A*Monto Total: $${document.getElementById('cart-total').innerText.split('≈')[0].replace('Total: ', '').trim()}*`;
  
  window.open(`https://wa.me/56998644532?text=${msg}`);
}
</script>

</body>
</html>
