<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puros Premium</title>

<style>
/* ==================== ESTILOS GENERALES ==================== */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  background:#111;
  color:#fff;
}

/* HEADER */
.header{
  background:#000;
  padding:15px 0;
  border-bottom:1px solid #333;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
}

.logo{
  color:#d4af37;
}

.nav a{
  color:#fff;
  margin-left:15px;
  text-decoration:none;
}

/* HERO */
.hero{
  height:60vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
  url('Screenshot_20260501-034528.png') center/cover;
}

.btn{
  display:inline-block;
  margin-top:15px;
  padding:10px 20px;
  background:#d4af37;
  color:#000;
  text-decoration:none;
  border-radius:5px;
}

/* PRODUCTOS */
.productos{
  padding:50px 0;
}

.producto-card{
  background:#1a1a1a;
  margin-bottom:20px;
  border-radius:10px;
  overflow:hidden;
}

.producto-imagen img{
  width:100%;
  height:250px;
  object-fit:cover;
}

.producto-info{
  padding:15px;
}

.precio{
  color:#d4af37;
  font-weight:bold;
}

.btn-comprar{
  margin-top:10px;
  padding:8px 15px;
  border:none;
  background:#d4af37;
  cursor:pointer;
}

/* FOOTER */
.footer{
  text-align:center;
  padding:20px;
  background:#000;
}
</style>
</head>

<body>

<header class="header">
  <div class="container">
    <h1 class="logo">🍂 PUROS CUBANOS</h1>
    <nav class="nav">
      <a href="#inicio">Inicio</a>
      <a href="#productos">Productos</a>
      <a href="#contacto">Contacto</a>
    </nav>
  </div>
</header>

<section id="inicio" class="hero">
  <div>
    <h2>Puros Cubanos Premium</h2>
    <p>Auténticos sabores de Cuba</p>
    <a href="#productos" class="btn">Ver Productos</a>
  </div>
</section>

<section id="productos" class="productos">
  <div class="container">

    <!-- Producto 1 -->
    <div class="producto-card">
      <div class="producto-imagen">
        <img src="Screenshot_20260501-034528.png">
      </div>
      <div class="producto-info">
        <h3>Puro Clásico</h3>
        <p>Sabor equilibrado y suave.</p>
        <span class="precio" data-usd="12">$12 USD</span>
        <span class="clp"></span><br>
        <button onclick="comprar('Puro Clásico',12)" class="btn-comprar">Comprar</button>
      </div>
    </div>

    <!-- Producto 2 -->
    <div class="producto-card">
      <div class="producto-imagen">
        <img src="Screenshot_20260501-034604.png">
      </div>
      <div class="producto-info">
        <h3>Puro Reserva</h3>
        <p>Aromas intensos y refinados.</p>
        <span class="precio" data-usd="18">$18 USD</span>
        <span class="clp"></span><br>
        <button onclick="comprar('Puro Reserva',18)" class="btn-comprar">Comprar</button>
      </div>
    </div>

    <!-- Producto 3 -->
    <div class="producto-card">
      <div class="producto-imagen">
        <img src="Screenshot_20260501-034637.png">
      </div>
      <div class="producto-info">
        <h3>Puro Premium</h3>
        <p>Experiencia de lujo y calidad.</p>
        <span class="precio" data-usd="25">$25 USD</span>
        <span class="clp"></span><br>
        <button onclick="comprar('Puro Premium',25)" class="btn-comprar">Comprar</button>
      </div>
    </div>

  </div>
</section>

<footer class="footer">
  <p>© 2026 Puros Premium</p>
</footer>

<script>
const tasa = 950;

document.querySelectorAll(".precio").forEach(el => {
  const usd = el.dataset.usd;
  const clp = usd * tasa;
  el.parentElement.querySelector(".clp").innerText =
    " / $" + clp.toLocaleString("es-CL") + " CLP";
});

function comprar(nombre, precio){
  alert("Elegiste: " + nombre + " ($" + precio + " USD)");
}
</script>

</body>
</html>
