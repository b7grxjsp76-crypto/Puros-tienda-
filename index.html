<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul | El Humo Maestro</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,900&family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   FUNDAMENTOS Y ESTÉTICA (Mantenidos y Mejorados)
   ========================================================================== */
:root {
  --dorado: #d4af37;
  --dorado-mate: #aa8c2c;
  --negro-absoluto: #050505;
  --negro-carbon: #0d0d0d;
  --gris-tabaco: #1a1a1a;
  --blanco-humo: #f5f5f5;
  --transicion: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Lato', sans-serif;
  background: var(--negro-absoluto);
  color: var(--blanco-humo);
  line-height: 1.8;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
  opacity: 0.3; z-index: -1; pointer-events: none;
}

h1, h2, h3, h4, .brand { font-family: 'Playfair Display', serif; }

/* NAVEGACIÓN */
.header {
  background: rgba(0,0,0,0.95);
  padding: 25px 0;
  border-bottom: 2px solid var(--dorado);
  position: sticky;
  top: 0; z-index: 1000;
  backdrop-filter: blur(10px);
}

.header .logo { text-align: center; margin-bottom: 15px; }
.logo img { height: 80px; filter: drop-shadow(0 0 10px rgba(212,175,55,0.4)); }

.nav { display: flex; justify-content: center; gap: 40px; }
.nav a {
  color: var(--dorado);
  text-decoration: none;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 5px;
  font-weight: 900;
}

/* HERO */
.hero {
  height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.9)), url('file_00000000e124720eacda71c2b88a43d3.png') center/cover fixed;
}

.hero-box { text-align: center; padding: 40px; border: 1px solid rgba(212,175,55,0.3); }
.hero h1 { font-size: clamp(50px, 10vw, 120px); color: var(--dorado); font-style: italic; }

/* CATÁLOGO */
.productos { padding: 100px 20px; }
.prod-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 40px;
  max-width: 1200px;
  margin: auto;
}

.card {
  background: var(--gris-tabaco);
  border-radius: 20px;
  padding: 30px;
  border: 1px solid #222;
  transition: var(--transicion);
  cursor: default;
}

.card:hover { border-color: var(--dorado); }

/* Elementos interactivos (Imagen y Título) */
.card-trigger { cursor: pointer; transition: var(--transicion); }
.card-trigger:hover { opacity: 0.8; }

.card img { 
  width: 100%; height: 300px; object-fit: cover; 
  border-radius: 15px; margin-bottom: 20px;
  box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

.card h3 { color: var(--dorado); font-size: 28px; margin-bottom: 10px; }

.tech-spec {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  font-size: 12px; color: #888; margin-bottom: 20px;
  border-top: 1px solid #333; padding-top: 15px;
}
.tech-spec b { color: var(--dorado); }

.precio-tag { font-size: 24px; font-weight: 900; color: white; display: block; margin-bottom: 20px; }

/* CARRITO DISEÑO MEJORADO */
.cart-drawer {
  position: fixed; right: 20px; bottom: 110px; width: 350px;
  background: var(--negro-carbon); border: 2px solid var(--dorado);
  border-radius: 20px; padding: 25px; display: none; z-index: 999;
  box-shadow: 0 20px 50px rgba(0,0,0,1);
}

.cart-list { list-style: none; margin-bottom: 15px; max-height: 200px; overflow-y: auto; }
.cart-list li { 
  display: flex; justify-content: space-between; font-size: 13px;
  padding: 8px 0; border-bottom: 1px solid #222;
}

.btn-buy {
  width: 100%; padding: 15px; background: var(--dorado); color: black;
  font-weight: 900; border: none; border-radius: 50px; cursor: pointer;
  text-transform: uppercase; font-size: 11px; transition: var(--transicion);
}
.btn-buy:hover { background: white; }

.btn-clear {
  background: transparent; color: #666; border: none; font-size: 10px;
  text-decoration: underline; cursor: pointer; margin-top: 10px; width: 100%;
}

/* MODAL DE DETALLES */
#product-modal {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.95); z-index: 3000; overflow-y: auto;
}

.modal-content {
  max-width: 900px; margin: 5% auto; padding: 40px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 40px;
}

.close-modal {
  position: fixed; top: 30px; right: 40px; color: var(--dorado);
  font-size: 50px; cursor: pointer;
}

@media (max-width: 768px) {
  .modal-content { grid-template-columns: 1fr; text-align: center; }
  .cart-drawer { width: 90%; right: 5%; }
}

.whatsapp-float {
  position: fixed; bottom: 30px; right: 30px; background: #25D366;
  width: 70px; height: 70px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 35px;
  color: white; text-decoration: none; z-index: 1001;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo"><img src="file_000000009bac71f5a5db74bc3bed2a62.png"></div>
  <nav class="nav">
    <a href="#productos">Catálogo</a>
    <a href="#" onclick="toggleCart()">Humidor (<span id="cart-count">0</span>)</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-box">
    <p>Vuelta Abajo</p>
    <h1>MAFU</h1>
  </div>
</section>

<section class="productos" id="productos">
  <div class="prod-grid">
    
    <div class="card">
      <div class="card-trigger" onclick="showProduct('p1')">
        <img src="Screenshot_20260501-034528.png">
        <h3>MAFU Clásico</h3>
      </div>
      <div class="tech-spec">
        <span><b>Vitola:</b> Robusto</span>
        <span><b>Capa:</b> Conn. Shade</span>
      </div>
      <span class="precio-tag">$12 USD</span>
      <div style="display: flex; gap: 10px;">
        <input type="number" value="1" min="1" id="q_p1" style="width: 50px; background: #000; border: 1px solid var(--dorado); color: white; text-align: center;">
        <button class="btn-buy" onclick="addToCart('p1')">Añadir</button>
      </div>
    </div>

    <div class="card">
      <div class="card-trigger" onclick="showProduct('p2')">
        <img src="Screenshot_20260501-034604.png">
        <h3>MAFU Reserva</h3>
      </div>
      <div class="tech-spec">
        <span><b>Vitola:</b> Toro</span>
        <span><b>Añejamiento:</b> 3 Años</span>
      </div>
      <span class="precio-tag">$18 USD</span>
      <div style="display: flex; gap: 10px;">
        <input type="number" value="1" min="1" id="q_p2" style="width: 50px; background: #000; border: 1px solid var(--dorado); color: white; text-align: center;">
        <button class="btn-buy" onclick="addToCart('p2')">Añadir</button>
      </div>
    </div>

    <div class="card">
      <div class="card-trigger" onclick="showProduct('p3')">
        <img src="Screenshot_20260501-034637.png">
        <h3>MAFU Premium</h3>
      </div>
      <div class="tech-spec">
        <span><b>Vitola:</b> Churchill</span>
        <span><b>Capa:</b> Maduro</span>
      </div>
      <span class="precio-tag">$25 USD</span>
      <div style="display: flex; gap: 10px;">
        <input type="number" value="1" min="1" id="q_p3" style="width: 50px; background: #000; border: 1px solid var(--dorado); color: white; text-align: center;">
        <button class="btn-buy" onclick="addToCart('p3')">Añadir</button>
      </div>
    </div>

  </div>
</section>

<div id="product-modal">
  <span class="close-modal" onclick="closeModal()">&times;</span>
  <div class="modal-content" id="modal-body"></div>
</div>

<div class="cart-drawer" id="cart-ui">
  <h3>Tu Selección</h3>
  <ul id="cart-list" class="cart-list"></ul>
  <div id="cart-total" style="font-weight: 700; text-align: center; border-top: 1px solid #333; padding-top: 10px;"></div>
  <button onclick="sendOrder()" class="btn-buy" style="margin-top: 15px; background: #25D366; color: white;">Finalizar Pedido</button>
  <button class="btn-clear" onclick="clearCart()">Vaciar todo el carrito</button>
</div>

<a href="https://wa.me/56998644532" class="whatsapp-float" target="_blank">W</a>

<script>
// DATOS EXTENDIDOS DE PRODUCTOS
const productDB = {
  p1: { name: "MAFU Clásico", price: 12, img: "Screenshot_20260501-034528.png", desc: "Elaborado con hojas seleccionadas de Vuelta Abajo, el Clásico ofrece una fumada cremosa con sutiles notas de madera y frutos secos. Ideal para maridar con cafés suaves.", spec: "Tripa Larga, Torcido a Mano." },
  p2: { name: "MAFU Reserva", price: 18, img: "Screenshot_20260501-034604.png", desc: "Un ejemplar de carácter medio-fuerte con 3 años de añejamiento. Destacan sus notas de cuero noble, tierra húmeda y un final picante muy equilibrado.", spec: "Capa Habano 2000, Fortaleza Media." },
  p3: { name: "MAFU Premium", price: 25, img: "Screenshot_20260501-034637.png", desc: "Nuestra joya de la corona. Un Churchill imponente envuelto en una capa madura aceitosa. Evolución compleja de cacao amargo y pimienta negra.", spec: "Añejamiento Especial 5 Años." }
};

let cart = JSON.parse(localStorage.getItem('mafu_cart')) || [];

// MOSTRAR DETALLES DEL PRODUCTO
function showProduct(id) {
  const p = productDB[id];
  const modal = document.getElementById('product-modal');
  document.getElementById('modal-body').innerHTML = `
    <img src="${p.img}" style="width:100%; border-radius:20px; border:1px solid var(--dorado);">
    <div>
      <h2 style="color:var(--dorado); font-size:45px; margin-bottom:20px;">${p.name}</h2>
      <p style="font-size:18px; margin-bottom:20px; color:#ccc;">${p.desc}</p>
      <div style="background:#111; padding:20px; border-radius:10px; margin-bottom:30px;">
        <p><b>Detalle Técnico:</b> ${p.spec}</p>
        <p style="font-size:24px; color:white; margin-top:10px;">$${p.price} USD</p>
      </div>
      <button class="btn-buy" onclick="addToCart('${id}'); closeModal();">Añadir al Humidor</button>
    </div>
  `;
  modal.style.display = 'block';
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('product-modal').style.display = 'none';
  document.body.style.overflow = 'auto';
}

// LÓGICA DEL CARRITO
function addToCart(id) {
  const p = productDB[id];
  const qty = parseInt(document.getElementById('q_' + id)?.value || 1);
  const existing = cart.find(item => item.id === id);
  
  if(existing) existing.qty += qty;
  else cart.push({ id: id, name: p.name, price: p.price, qty: qty });
  
  saveCart();
  document.getElementById('cart-ui').style.display = 'block';
}

function saveCart() {
  localStorage.setItem('mafu_cart', JSON.stringify(cart));
  renderCart();
}

function renderCart() {
  const list = document.getElementById('cart-list');
  const countSpan = document.getElementById('cart-count');
  list.innerHTML = "";
  let totalUSD = 0;
  let totalItems = 0;

  cart.forEach((item, index) => {
    totalUSD += item.price * item.qty;
    totalItems += item.qty;
    list.innerHTML += `
      <li>
        <span>${item.name} (x${item.qty})</span>
        <b>$${item.price * item.qty} USD</b>
      </li>`;
  });

  countSpan.innerText = totalItems;
  document.getElementById('cart-total').innerHTML = `Total: $${totalUSD} USD<br><span style="color:var(--dorado)">≈ $${(totalUSD * 950).toLocaleString()} CLP</span>`;
}

function clearCart() {
  if(confirm("¿Deseas vaciar toda tu selección?")) {
    cart = [];
    saveCart();
    document.getElementById('cart-ui').style.display = 'none';
  }
}

function toggleCart() {
  const ui = document.getElementById('cart-ui');
  ui.style.display = (ui.style.display === 'block') ? 'none' : 'block';
}

function sendOrder() {
  if(cart.length === 0) return alert("Tu humidor está vacío.");
  let msg = "Hola MAFU, deseo confirmar este pedido:%0A";
  cart.forEach(i => msg += `• ${i.name} (x${i.qty})%0A`);
  msg += `%0A*Total: ${document.getElementById('cart-total').innerText.split('≈')[0].trim()}*`;
  window.open(`https://wa.me/56998644532?text=${msg}`);
}

// Inicialización
renderCart();
</script>

</body>
</html>
