<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Puros Premium</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: url('tabaco.jpg') no-repeat center/cover;
  color: white;
}

body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.65);
  top: 0;
  left: 0;
  z-index: -1;
}

header {
  text-align: center;
  padding: 20px;
}

.contenedor {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 20px;
}

.card {
  background: rgba(0,0,0,0.85);
  padding: 15px;
  border-radius: 15px;
  width: 260px;
  text-align: center;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.05);
}

img {
  width: 100%;
  border-radius: 10px;
}

button {
  margin-top: 10px;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: gold;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: orange;
}

.clp {
  color: #00ffcc;
}
</style>

</head>

<body>

<header>
<h1>🍂 Puros Premium</h1>
<p>Selección exclusiva</p>
</header>

<div class="contenedor">

<div class="card">
<img src="puro1.png">
<h3>Puro Clásico</h3>
<p>$12 USD</p>
<p class="clp" id="clp1"></p>
<button onclick="comprar('Puro Clásico',12)">Comprar</button>
</div>

<div class="card">
<img src="puro2.png">
<h3>Puro Reserva</h3>
<p>$18 USD</p>
<p class="clp" id="clp2"></p>
<button onclick="comprar('Puro Reserva',18)">Comprar</button>
</div>

<div class="card">
<img src="puro3.png">
<h3>Puro Premium</h3>
<p>$25 USD</p>
<p class="clp" id="clp3"></p>
<button onclick="comprar('Puro Premium',25)">Comprar</button>
</div>

</div>

<script>
const tasa = 950;

document.getElementById("clp1").innerText = "$" + (12*tasa).toLocaleString("es-CL") + " CLP";
document.getElementById("clp2").innerText = "$" + (18*tasa).toLocaleString("es-CL") + " CLP";
document.getElementById("clp3").innerText = "$" + (25*tasa).toLocaleString("es-CL") + " CLP";

function comprar(nombre, precio){
  alert("Seleccionaste: " + nombre + " ($" + precio + " USD)");
}
</script>

</body>
</html>
