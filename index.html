<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul | El Humo Maestro de Vuelta Abajo</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,900&family=Lato:wght@100;300;400;700;900&display=swap" rel="stylesheet">

<style>
/* ==========================================================================
   FUNDAMENTOS Y ESTÉTICA DE LUJO
   ========================================================================== */
:root {
  --dorado: #d4af37;
  --dorado-mate: #aa8c2c;
  --negro-absoluto: #050505;
  --negro-carbon: #0d0d0d;
  --gris-tabaco: #1a1a1a;
  --blanco-humo: #f5f5f5;
  --transicion: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Lato', sans-serif;
  background: var(--negro-absoluto);
  color: var(--blanco-humo);
  line-height: 1.8;
  overflow-x: hidden;
}

/* Capa de textura de lino para sensación premium */
body::before {
  content: "";
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url('https://www.transparenttextures.com/patterns/black-linen.png');
  opacity: 0.3; z-index: -1; pointer-events: none;
}

h1, h2, h3, h4, .brand { font-family: 'Playfair Display', serif; }

/* ==========================================================================
   NAVEGACIÓN ELITISTA
   ========================================================================== */
.header {
  background: rgba(0,0,0,0.95);
  padding: 25px 0;
  border-bottom: 2px solid var(--dorado);
  position: sticky;
  top: 0; z-index: 1000;
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.9);
}

.header .logo { text-align: center; margin-bottom: 15px; }
.logo img { 
  height: 95px; 
  filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); 
  transition: var(--transicion);
}
.logo img:hover { transform: scale(1.05); }

.nav {
  display: flex;
  justify-content: center;
  gap: 40px;
}

.nav a {
  color: var(--dorado);
  text-decoration: none;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 5px;
  font-weight: 900;
  position: relative;
  transition: var(--transicion);
}

.nav a::after {
  content: ""; position: absolute; bottom: -5px; left: 50%; width: 0; height: 1px;
  background: var(--dorado); transition: var(--transicion); transform: translateX(-50%);
}

.nav a:hover { color: white; }
.nav a:hover::after { width: 100%; }

/* ==========================================================================
   HERO: LA PUERTA A CUBA
   ========================================================================== */
.hero {
  height: 85vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  background: 
    linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.9)),
    url('file_00000000e124720eacda71c2b88a43d3.png') center/cover fixed;
}

.hero-box {
  text-align: center;
  padding: 40px;
  border: 1px solid rgba(212,175,55,0.3);
  backdrop-filter: blur(2px);
}

.hero h1 { 
  font-size: clamp(60px, 12vw, 150px); 
  color: var(--dorado); 
  line-height: 1; 
  font-style: italic;
  font-weight: 900;
}

.hero p { 
  font-size: 14px; 
  letter-spacing: 15px; 
  text-transform: uppercase; 
  color: white;
}

/* ==========================================================================
   SECCIÓN HISTORIA Y TERROIR
   ========================================================================== */
.section-intro {
  padding: 120px 20px;
  max-width: 1000px;
  margin: auto;
  text-align: center;
}

.section-intro h2 { font-size: 55px; color: var(--dorado); margin-bottom: 40px; }
.section-intro p { font-size: 20px; color: #aaa; font-style: italic; }

/* ==========================================================================
   GRID DE PROCESOS (EL CORAZÓN DE LA VEGA)
   ========================================================================== */
.vega-section { padding: 100px 20px; background: var(--negro-carbon); }
.vega-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
  max-width: 1400px;
  margin: auto;
}

.vega-card {
  height: 450px;
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  cursor: pointer;
  border: 1px solid #1a1a1a;
  transition: var(--transicion);
}

.vega-card:hover { transform: translateY(-10px); border-color: var(--dorado); }
.vega-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.4; transition: 1s; }
.vega-card:hover img { opacity: 0.8; transform: scale(1.1); }

.vega-card .overlay-text {
  position: absolute;
  bottom: 0; left: 0; width: 100%;
  padding: 40px 20px;
  background: linear-gradient(transparent, rgba(0,0,0,1));
  text-align: center;
}

.vega-card h3 { color: var(--dorado); font-size: 24px; text-transform: uppercase; letter-spacing: 3px; }

/* ==========================================================================
   CATÁLOGO DE SELECCIÓN
   ========================================================================== */
.productos { padding: 120px 20px; }
.prod-grid {

  grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));

  max-width: 1300px;
  margin: auto;
}

.card {

  border-radius: 30px;
  padding: 50px;
  border: 1px solid #222;
  transition: var(--transicion);
  position: relative;
}

.card:hover { border-color: var(--dorado); box-shadow: 0 20px 50px rgba(0,0,0,0.8); }

.card img { 
  width: 100%; 
  height: 380px; 
  object-fit: cover; 
  border-radius: 20px; 
  margin-bottom: 30px;
  box-shadow: 0 15px 35px rgba(0,0,0,0.5);
}

.card h3 { color: var(--dorado); font-size: 32px; margin-bottom: 15px; }

.tech-spec {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  font-size: 13px;
  color: #888;
  margin-bottom: 25px;
  border-top: 1px solid #333;
  padding-top: 20px;
}

.tech-spec b { color: var(--dorado); text-transform: uppercase; }

.precio-tag { font-size: 28px; font-weight: 900; color: white; display: block; margin-bottom: 25px; }

.btn-buy {
  width: 100%;
  padding: 18px;
  background: var(--dorado);
  color: black;
  font-weight: 900;
  border: none;
  border-radius: 50px;
  text-transform: uppercase;
  letter-spacing: 2px;
  cursor: pointer;
  transition: var(--transicion);
}

.btn-buy:hover { background: white; transform: scale(1.02); }

/* ==========================================================================
   PÁGINAS INTERNAS DINÁMICAS (OVERLAY)
   ========================================================================== */
#internal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: var(--negro-absoluto);
  z-index: 2000;
  overflow-y: auto;
  padding: 100px 20px;
}

.close-internal {
  position: fixed;
  top: 40px; right: 50px;
  color: var(--dorado);
  font-size: 60px;
  cursor: pointer;
  z-index: 2100;
}

.internal-container {
  max-width: 1100px;
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: start;
}

@media (max-width: 850px) { .internal-container { grid-template-columns: 1fr; } }

.internal-img { width: 100%; border-radius: 20px; border: 1px solid var(--dorado); }
.internal-text h2 { font-size: 60px; color: var(--dorado); margin-bottom: 30px; }
.internal-text p { font-size: 20px; color: #ccc; margin-bottom: 30px; }

/* ==========================================================================
   CARRITO WHATSAPP
   ========================================================================== */
.cart-drawer {
  position: fixed; right: 30px; bottom: 120px; width: 380px;
  background: var(--gris-tabaco); border: 2px solid var(--dorado);
  border-radius: 25px; padding: 35px; display: none; z-index: 999;
  box-shadow: 0 20px 60px rgba(0,0,0,1);
}

.cart-drawer h3 { color: var(--dorado); text-align: center; margin-bottom: 20px; }
.cart-list { list-style: none; margin-bottom: 20px; max-height: 250px; overflow-y: auto; }
.cart-list li { 
  display: flex; justify-content: space-between; 
  padding: 10px 0; border-bottom: 1px solid #333;
}

.btn-clear {
  background: transparent;
  color: #ff4444;
  border: 1px solid #ff4444;
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 50px;
  cursor: pointer;
  text-transform: uppercase;
