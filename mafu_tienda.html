<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAFU Cuban Soul</title>

<style>
body { font-family: Arial; background:#000; color:#fff; text-align:center; }
.card { border:1px solid gold; padding:20px; margin:20px; border-radius:10px; cursor:pointer; }
button { padding:10px; margin:5px; cursor:pointer; }
</style>

</head>
<body>

<h1>MAFU Cuban Soul</h1>

<div class="card" onclick="goToPage('puro-clasico.html')">
  <h2>MAFU Clásico</h2>

  <div>
    <button onclick="event.stopPropagation(); changeQty('q1', -1)">-</button>
    <input type="number" id="q1" value="1" min="1">
    <button onclick="event.stopPropagation(); changeQty('q1', 1)">+</button>
  </div>

  <button onclick="event.stopPropagation(); addToCart('Clásico', 12, 'q1')">
    Añadir
  </button>
</div>

<div class="card" onclick="goToPage('puro-reserva.html')">
  <h2>MAFU Reserva</h2>

  <div>
    <button onclick="event.stopPropagation(); changeQty('q2', -1)">-</button>
    <input type="number" id="q2" value="1" min="1">
    <button onclick="event.stopPropagation(); changeQty('q2', 1)">+</button>
  </div>

  <button onclick="event.stopPropagation(); addToCart('Reserva', 18, 'q2')">
    Añadir
  </button>
</div>

<div class="card" onclick="goToPage('puro-premium.html')">
  <h2>MAFU Premium</h2>

  <div>
    <button onclick="event.stopPropagation(); changeQty('q3', -1)">-</button>
    <input type="number" id="q3" value="1" min="1">
    <button onclick="event.stopPropagation(); changeQty('q3', 1)">+</button>
  </div>

  <button onclick="event.stopPropagation(); addToCart('Premium', 25, 'q3')">
    Añadir
  </button>
</div>

<script>
let cart = [];

function changeQty(id, delta) {
  const input = document.getElementById(id);
  let value = parseInt(input.value) || 1;
  value += delta;
  if (value < 1) value = 1;
  input.value = value;
}

function goToPage(url) {
  window.location.href = url;
}

function addToCart(name, price, id) {
  const qty = document.getElementById(id).value;
  cart.push({name, price, qty});
  alert("Agregado al carrito");
}
</script>

</body>
</html>
